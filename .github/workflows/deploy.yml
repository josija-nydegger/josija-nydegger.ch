# Website mit Astro bauen, prüfen und auf Cloudflare Workers veröffentlichen.
# Pull Requests: nur bauen und prüfen. Push auf main: zusätzlich veröffentlichen.
# Voraussetzung: Repo-Secrets CLOUDFLARE_API_TOKEN (Vorlage "Edit Cloudflare Workers") und CLOUDFLARE_ACCOUNT_ID.
# Bis November 2026 GitHub Pages; Konfiguration für Cloudflare: wrangler.jsonc und _cloudflare/worker.js.
name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird nicht abgebrochen
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typen prüfen
        run: npm run check
      - name: Tests (Tools und Website)
        run: npm test
      - name: Website bauen
        run: npm run build
      - name: Auf Cloudflare veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
